<!DOCTYPE html>
<html lang="ja">
<head>

<title>ぬりえ</title>
<style>
  :root {
    --bg: #f4eee3;
    --panel: #fffdf8;
    --ink: #3b302a;
    --sub: #7a6b60;
    --line: #e2d7c5;
    --accent: #d9583b;
    --accent-ink: #ffffff;
    --soft: #f7f1e6;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic UI", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  button, input { font: inherit; color: inherit; }
  .app { max-width: 1240px; margin: 0 auto; padding: 12px 16px 20px; }

  .bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap; margin-bottom: 12px;
  }
  .bar h1 {
    margin: 0; font-size: 24px; letter-spacing: .12em; font-weight: 700;
    display: flex; align-items: center; gap: 10px;
  }
  .dots { display: inline-flex; gap: 4px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .btn {
    min-height: 42px; padding: 0 14px;
    border: 1.5px solid var(--line); border-radius: 999px;
    background: var(--panel); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background .12s, transform .06s, border-color .12s;
  }
  .btn:hover:not(:disabled) { background: #fff; border-color: #cdbfa8; }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .btn.primary:hover { background: #c74c31; border-color: #c74c31; }
  .btn svg, .tool svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  :focus-visible { outline: 3px solid #2f7de1; outline-offset: 2px; }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; align-items: start; }

  .stage-wrap { min-width: 0; }
  .stage {
    position: relative; margin: 0 auto;
    width: min(100%, calc(100vh - 130px)); min-width: 260px;
    aspect-ratio: 1 / 1;
    background: #fff; border-radius: var(--radius); overflow: hidden;
    box-shadow: 0 0 0 1.5px var(--line), 0 10px 28px rgba(90, 60, 30, .12);
  }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #line { touch-action: none; cursor: crosshair; }
  #ring {
    position: absolute; pointer-events: none; display: none;
    border: 1.5px solid rgba(0,0,0,.65); box-shadow: 0 0 0 1.5px rgba(255,255,255,.8);
    border-radius: 50%; transform: translate(-50%, -50%);
  }
  #hint { margin: 10px auto 0; text-align: center; color: var(--sub); font-size: 14px; min-height: 1.5em; }

  .panel {
    background: var(--panel); border: 1.5px solid var(--line); border-radius: var(--radius);
    padding: 14px; display: grid; gap: 16px;
    max-height: calc(100vh - 86px); overflow: auto;
  }
  .panel h2 { margin: 0 0 8px; font-size: 13px; color: var(--sub); letter-spacing: .1em; font-weight: 700; }

  .pics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pic {
    padding: 4px 4px 2px; border: 2px solid var(--line); border-radius: 10px; background: #fff; cursor: pointer;
    display: grid; gap: 2px; justify-items: center; font-size: 12px;
  }
  .pic canvas { width: 100%; height: auto; display: block; border-radius: 6px; }
  .pic[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(217, 88, 59, .2); font-weight: 700; }

  .tools { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .tool {
    min-height: 44px; border: 2px solid var(--line); border-radius: 10px; background: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .tool[aria-pressed="true"] { border-color: var(--accent); background: #fdece6; font-weight: 700; }

  .row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .row label { flex: none; }
  .row input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .size-box { width: 44px; height: 44px; flex: none; display: grid; place-items: center; background: var(--soft); border-radius: 10px; overflow: hidden; }
  #sizeDot { border-radius: 50%; background: var(--ink); display: block; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 10px; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }

  .current { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  #curSwatch { width: 44px; height: 44px; border-radius: 12px; border: 2px solid rgba(0,0,0,.18); flex: none; }
  .custom { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
  .custom input { width: 44px; height: 36px; padding: 0; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; }
  .palette { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; }
  .sw {
    aspect-ratio: 1 / 1; width: 100%; border-radius: 50%; border: 1.5px solid rgba(0,0,0,.18);
    cursor: pointer; padding: 0;
  }
  .sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4.5px var(--ink); }

  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; }
    .stage { width: 100%; }
    .panel { max-height: none; }
    .pics { grid-template-columns: repeat(6, 1fr); }
    .tools { grid-template-columns: repeat(4, 1fr); }
    .palette { grid-template-columns: repeat(9, 1fr); }
  }
  @media (max-width: 520px) {
    .app { padding: 10px 16px 16px; }
    .bar h1 { font-size: 20px; }
    .btn { padding: 0 11px; font-size: 14px; }
    .pics { grid-template-columns: repeat(3, 1fr); }
    .tool { flex-direction: column; gap: 2px; font-size: 12px; padding: 6px 2px; }
    .palette { grid-template-columns: repeat(7, 1fr); }
  }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <h1>
      <span class="dots" aria-hidden="true"><i style="background:#e53935"></i><i style="background:#fdd835"></i><i style="background:#43a047"></i><i style="background:#1e88e5"></i></span>
      ぬりえ
    </h1>
    <div class="actions">
      <button class="btn" id="undo" type="button" title="元に戻す (Ctrl+Z)">
        <svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 12"/></svg>元に戻す
      </button>
      <button class="btn" id="redo" type="button" title="やり直す (Ctrl+Y)">
        <svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5"/><path d="M20 12H10a6 6 0 0 0 0 12"/></svg>やり直す
      </button>
      <button class="btn" id="clear" type="button">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>全部消す
      </button>
      <button class="btn primary" id="save" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>画像を保存
      </button>
    </div>
  </header>

  <main>
    <section class="stage-wrap">
      <div class="stage" id="stage">
        <canvas id="color" width="900" height="900"></canvas>
        <canvas id="line" width="900" height="900" role="img" aria-label="ぬりえのキャンバス"></canvas>
        <div id="ring"></div>
      </div>
      <p id="hint" aria-live="polite"></p>
    </section>

    <aside class="panel">
      <section>
        <h2>絵をえらぶ</h2>
        <div class="pics" id="pics"></div>
      </section>

      <section>
        <h2>道具</h2>
        <div class="tools" id="tools">
          <button class="tool" type="button" data-tool="fill">
            <svg viewBox="0 0 24 24"><path d="M4 12l8-8 8 8-7 7a1.5 1.5 0 0 1-2 0z"/><path d="M4 12h16"/><path d="M20 16s1.8 2.2 1.8 3.5a1.8 1.8 0 0 1-3.6 0C18.200 18.200 20 16 20 16z"/></svg>塗りつぶし
          </button>
          <button class="tool" type="button" data-tool="brush">
            <svg viewBox="0 0 24 24"><path d="M15 4l5 5-9 9-5-5z"/><path d="M6 13c-2 1-3 3-3 7 4 0 6-1 7-3"/></svg>ブラシ
          </button>
          <button class="tool" type="button" data-tool="erase">
            <svg viewBox="0 0 24 24"><path d="M9 20l-5-5L14 5l6 6-9 9z"/><path d="M9 20h11M9 10l6 6"/></svg>消しゴム
          </button>
          <button class="tool" type="button" data-tool="pick">
            <svg viewBox="0 0 24 24"><path d="M16 3l5 5-3 3-5-5z"/><path d="M14 8L5 17l-1 3 3-1 9-9"/></svg>スポイト
          </button>
        </div>
        <div class="row">
          <label for="size">太さ</label>
          <input type="range" id="size" min="4" max="120" step="1" value="30">
          <span class="size-box" aria-hidden="true"><i id="sizeDot"></i></span>
        </div>
        <label class="check"><input type="checkbox" id="inside" checked> 線からはみ出さない</label>
      </section>

      <section>
        <h2>色</h2>
        <div class="current">
          <span id="curSwatch"></span>
          <span>いまの色</span>
          <label class="custom">好きな色 <input type="color" id="custom" value="#e53935"></label>
        </div>
        <div class="palette" id="palette"></div>
      </section>
    </aside>
  </main>
</div>

<script>
(function () {
'use strict';

/* ---------- 定数 ---------- */
var S = 900;            // キャンバス内部解像度
var D = 600;            // 線画の設計座標
var N = S * S;
var TAU = Math.PI * 2;
var INK = '#2b2420';
var MAX_HISTORY = 20;

var COLORS = [
  '#e53935', '#ff6f61', '#f48fb1', '#ffc9d6', '#c2185b', '#8e24aa', '#ce93d8',
  '#fb8c00', '#ffb74d', '#fdd835', '#fff59d', '#ffe0b2', '#f3c9a5', '#d99a6c',
  '#2e7d32', '#43a047', '#8bc34a', '#c5e1a5', '#00897b', '#4db6ac', '#b2dfdb',
  '#3949ab', '#1e88e5', '#64b5f6', '#b3e5fc', '#00acc1', '#7e57c2', '#b39ddb',
  '#5d4037', '#8d6e63', '#bcaaa4', '#ffffff', '#bdbdbd', '#757575', '#212121'
];

/* ---------- 線画を描くための道具 ---------- */
function makeKit(g, lw) {
  g.lineWidth = lw; g.lineJoin = 'round'; g.lineCap = 'round';
  g.strokeStyle = INK; g.fillStyle = INK;
  var k = {
    g: g,
    // 閉じた形:下の線を消してから輪郭を描く(重なりの表現)
    shape: function (fn) {
      g.beginPath(); fn(g);
      g.save(); g.globalCompositeOperation = 'destination-out'; g.fillStyle = '#000'; g.fill(); g.restore();
      g.stroke();
    },
    line: function (fn) { g.beginPath(); fn(g); g.stroke(); },
    dot: function (x, y, rx, ry) { g.beginPath(); g.ellipse(x, y, rx, ry || rx, 0, 0, TAU); g.fill(); },
    circle: function (x, y, r) { k.shape(function (c) { c.arc(x, y, r, 0, TAU); }); },
    ellipse: function (x, y, rx, ry, rot) { k.shape(function (c) { c.ellipse(x, y, rx, ry, rot || 0, 0, TAU); }); },
    rect: function (x, y, w, h) { k.shape(function (c) { c.rect(x, y, w, h); }); },
    poly: function (pts) {
      k.shape(function (c) {
        pts.forEach(function (p, i) { if (i) c.lineTo(p[0], p[1]); else c.moveTo(p[0], p[1]); });
        c.closePath();
      });
    },
    // 複数の形を合体させた輪郭
    union: function (fns) {
      g.save(); g.lineWidth = g.lineWidth * 2;
      fns.forEach(function (fn) { g.beginPath(); fn(g); g.stroke(); });
      g.globalCompositeOperation = 'destination-out'; g.fillStyle = '#000';
      fns.forEach(function (fn) { g.beginPath(); fn(g); g.fill(); });
      g.restore();
    },
    within: function (clipFn, drawFn) { g.save(); g.beginPath(); clipFn(g); g.clip(); drawFn(); g.restore(); },
    mirror: function (fn) { fn(); g.save(); g.translate(D, 0); g.scale(-1, 1); fn(); g.restore(); },
    at: function (x, y, rot, fn) { g.save(); g.translate(x, y); g.rotate(rot); fn(); g.restore(); },
    scaled: function (cx, cy, s, fn) {
      g.save(); g.translate(cx, cy); g.scale(s, s); g.translate(-cx, -cy);
      g.lineWidth = g.lineWidth / s; fn(); g.restore();
    }
  };
  return k;
}

/* ---------- 共通パーツ ---------- */
function cloud(k, x, y, s) {
  s = s || 1;
  k.union([
    function (c) { c.arc(x, y, 24 * s, 0, TAU); },
    function (c) { c.arc(x + 30 * s, y - 14 * s, 28 * s, 0, TAU); },
    function (c) { c.arc(x + 62 * s, y, 24 * s, 0, TAU); },
    function (c) { c.ellipse(x + 31 * s, y + 10 * s, 44 * s, 18 * s, 0, 0, TAU); }
  ]);
}
function sun(k, x, y, r) {
  for (var i = 0; i < 12; i++) {
    k.at(x, y, i * TAU / 12, function () {
      k.line(function (c) { c.moveTo(r + 9, 0); c.lineTo(r + 24, 0); });
    });
  }
  k.circle(x, y, r);
}
function smallFlower(k, x, y, r, stemTo) {
  k.line(function (c) { c.moveTo(x, y); c.quadraticCurveTo(x + 6, (y + stemTo) / 2, x, stemTo); });
  var fns = [];
  for (var i = 0; i < 5; i++) {
    (function (a) {
      fns.push(function (c) { c.arc(x + Math.cos(a) * r, y + Math.sin(a) * r, r * 0.64, 0, TAU); });
    })(i * TAU / 5 - Math.PI / 2);
  }
  k.union(fns);
  k.circle(x, y, r * 0.5);
}
function leaf(k, x0, y0, x1, y1, b) {
  var mx = (x0 + x1) / 2, my = (y0 + y1) / 2, dx = x1 - x0, dy = y1 - y0;
  var len = Math.hypot(dx, dy), nx = -dy / len * b, ny = dx / len * b;
  k.shape(function (c) {
    c.moveTo(x0, y0); c.quadraticCurveTo(mx + nx, my + ny, x1, y1);
    c.quadraticCurveTo(mx - nx, my - ny, x0, y0); c.closePath();
  });
  k.line(function (c) { c.moveTo(x0, y0); c.lineTo(x0 + dx * 0.78, y0 + dy * 0.78); });
}
function star(k, x, y, R, r, n, rot) {
  var pts = [];
  for (var i = 0; i < n * 2; i++) {
    var a = rot + i * Math.PI / n, rr = i % 2 ? r : R;
    pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]);
  }
  k.poly(pts);
}
function petal(c, r0, r1, w) {
  c.moveTo(r0, 0);
  c.quadraticCurveTo((r0 + r1) / 2, w, r1, 0);
  c.quadraticCurveTo((r0 + r1) / 2, -w, r0, 0);
  c.closePath();
}
function seaweed(k, x, by, h) {
  k.shape(function (c) {
    c.moveTo(x - 12, by);
    c.bezierCurveTo(x - 42, by - h * 0.33, x + 22, by - h * 0.66, x - 4, by - h);
    c.bezierCurveTo(x + 46, by - h * 0.66, x - 14, by - h * 0.33, x + 12, by);
    c.closePath();
  });
}

/* ---------- 絵の定義 ---------- */
var PICS = [
  {
    id: 'flower', name: 'お花',
    draw: function (k) {
      k.shape(function (c) { c.moveTo(-10, 470); c.quadraticCurveTo(300, 410, 610, 470); c.lineTo(610, 610); c.lineTo(-10, 610); c.closePath(); });
      cloud(k, 50, 95, 1.1);
      cloud(k, 400, 50, 0.6);
      sun(k, 515, 90, 38);
      smallFlower(k, 95, 395, 22, 466);
      smallFlower(k, 510, 400, 22, 468);
      smallFlower(k, 190, 520, 17, 585);
      smallFlower(k, 430, 530, 17, 592);
      leaf(k, 296, 440, 185, 375, 34);
      leaf(k, 304, 410, 415, 350, 34);
      k.shape(function (c) {
        c.moveTo(292, 290); c.quadraticCurveTo(284, 390, 293, 476);
        c.lineTo(309, 476); c.quadraticCurveTo(300, 390, 308, 290); c.closePath();
      });
      for (var i = 0; i < 8; i++) {
        k.at(300, 215, i * TAU / 8, function () { k.ellipse(82, 0, 52, 27); });
      }
      k.circle(300, 215, 44);
      k.circle(300, 215, 24);
    }
  },
  {
    id: 'fish', name: 'おさかな',
    draw: function (k) {
      var g = k.g;
      var body = function (c) { c.ellipse(290, 290, 150, 95, 0, 0, TAU); };
      seaweed(k, 50, 545, 235);
      seaweed(k, 100, 548, 150);
      seaweed(k, 562, 545, 150);
      seaweed(k, 515, 550, 105);
      k.shape(function (c) {
        c.moveTo(-10, 520); c.quadraticCurveTo(150, 480, 300, 515); c.quadraticCurveTo(450, 550, 610, 500);
        c.lineTo(610, 610); c.lineTo(-10, 610); c.closePath();
      });
      star(k, 175, 552, 32, 14, 5, -Math.PI / 2);
      k.ellipse(400, 562, 24, 13); k.ellipse(446, 574, 14, 9);
      k.circle(110, 205, 14); k.circle(88, 155, 10); k.circle(122, 108, 18); k.circle(76, 70, 8);
      // 小さな魚
      k.poly([[430, 115], [392, 88], [392, 142]]);
      k.ellipse(472, 115, 50, 28);
      k.within(function (c) { c.ellipse(472, 115, 50, 28, 0, 0, TAU); }, function () {
        k.line(function (c) { c.moveTo(488, 80); c.quadraticCurveTo(476, 115, 488, 150); });
        k.line(function (c) { c.moveTo(455, 80); c.quadraticCurveTo(443, 115, 455, 150); });
      });
      k.dot(504, 109, 4);
      // 大きな魚
      k.shape(function (c) { c.moveTo(425, 290); c.lineTo(548, 205); c.quadraticCurveTo(516, 290, 548, 375); c.closePath(); });
      k.shape(function (c) { c.moveTo(220, 215); c.quadraticCurveTo(280, 85, 380, 222); c.closePath(); });
      k.shape(function (c) { c.moveTo(250, 378); c.quadraticCurveTo(300, 475, 350, 372); c.closePath(); });
      k.shape(body);
      k.within(body, function () {
        [215, 285, 345, 398].forEach(function (x) {
          k.line(function (c) { c.moveTo(x, 150); c.quadraticCurveTo(x + 26, 290, x, 430); });
        });
      });
      k.shape(function (c) { c.moveTo(262, 298); c.quadraticCurveTo(322, 292, 328, 345); c.quadraticCurveTo(276, 348, 262, 298); c.closePath(); });
      k.circle(185, 265, 16);
      k.dot(182, 267, 7);
      k.line(function (c) { c.moveTo(143, 305); c.quadraticCurveTo(160, 322, 178, 308); });
      void g;
    }
  },
  {
    id: 'butterfly', name: 'ちょうちょ',
    draw: function (k) {
      var upper = function (c) {
        c.moveTo(312, 285); c.bezierCurveTo(340, 120, 520, 50, 555, 140);
        c.bezierCurveTo(580, 220, 470, 300, 312, 300); c.closePath();
      };
      var lower = function (c) {
        c.moveTo(312, 300); c.bezierCurveTo(440, 300, 530, 380, 490, 460);
        c.bezierCurveTo(455, 530, 350, 480, 312, 330); c.closePath();
      };
      k.shape(function (c) { c.moveTo(-10, 562); c.quadraticCurveTo(300, 518, 610, 562); c.lineTo(610, 610); c.lineTo(-10, 610); c.closePath(); });
      cloud(k, 255, 60, 0.9);
      k.mirror(function () {
        smallFlower(k, 548, 495, 18, 572);
        smallFlower(k, 350, 520, 13, 560);
        k.shape(lower);
        k.shape(upper);
        k.scaled(458, 198, 0.6, function () { k.shape(upper); });
        k.scaled(422, 402, 0.56, function () { k.shape(lower); });
        k.circle(462, 196, 26);
        k.circle(424, 404, 17);
        k.line(function (c) { c.moveTo(308, 204); c.quadraticCurveTo(330, 150, 362, 128); });
        k.circle(364, 126, 7);
      });
      smallFlower(k, 300, 492, 15, 548);
      var body = function (c) { c.ellipse(300, 318, 15, 86, 0, 0, TAU); };
      k.shape(body);
      k.within(body, function () {
        [272, 302, 332, 362].forEach(function (y) {
          k.line(function (c) { c.moveTo(280, y); c.lineTo(320, y); });
        });
      });
      k.circle(300, 218, 21);
    }
  },
  {

/* ---------- 要素とキャンバス ---------- */
function $(id) { return document.getElementById(id); }
var stage = $('stage'), lineC = $('line'), colorC = $('color'), ring = $('ring'), hint = $('hint');
var lctx = lineC.getContext('2d', { willReadFrequently: true });
var cctx = colorC.getContext('2d', { willReadFrequently: true });

function offscreen() { var c = document.createElement('canvas'); c.width = c.height = S; return c; }
var scratchC = offscreen(), sx = scratchC.getContext('2d');
var snapC = offscreen(), snapx = snapC.getContext('2d');
var maskC = offscreen(), maskx = maskC.getContext('2d');
var tmpC = offscreen(), tmpx = tmpC.getContext('2d');

var labels = new Int32Array(N);     // 0 = 線、1以上 = 領域番号
var regionBuf = new Uint8Array(N);
var stackBuf = new Int32Array(N);
var maskLabel = 0;

/* ---------- 状態 ---------- */
var cur = 0;
var tool = 'fill', prevTool = 'fill';
var color = '#e53935';
var size = 30;
var stayInside = true;
var hist = [], hi = -1;
var saved = {};                     // 絵ごとの塗り状態(メモリ内のみ)

/* ---------- 線画と領域 ---------- */
function renderLine() {
  lctx.setTransform(1, 0, 0, 1, 0, 0);
  lctx.globalCompositeOperation = 'source-over';
  lctx.clearRect(0, 0, S, S);
  lctx.setTransform(S / D, 0, 0, S / D, 0, 0);
  PICS[cur].draw(makeKit(lctx, 4));
  lctx.setTransform(1, 0, 0, 1, 0, 0);
  computeLabels();
}

function computeLabels() {
  var a = lctx.getImageData(0, 0, S, S).data;
  var i, id = 0, sp, q, x;
  // 一時的に -1 = 線 として使う
  for (i = 0; i < N; i++) labels[i] = a[i * 4 + 3] > 96 ? -1 : 0;
  for (i = 0; i < N; i++) {
    if (labels[i] !== 0) continue;
    id++; sp = 0; stackBuf[sp++] = i; labels[i] = id;
    while (sp) {
      q = stackBuf[--sp]; x = q % S;
      if (x > 0 && labels[q - 1] === 0) { labels[q - 1] = id; stackBuf[sp++] = q - 1; }
      if (x < S - 1 && labels[q + 1] === 0) { labels[q + 1] = id; stackBuf[sp++] = q + 1; }
      if (q >= S && labels[q - S] === 0) { labels[q - S] = id; stackBuf[sp++] = q - S; }
      if (q < N - S && labels[q + S] === 0) { labels[q + S] = id; stackBuf[sp++] = q + S; }
    }
  }
  for (i = 0; i < N; i++) if (labels[i] < 0) labels[i] = 0;
  maskLabel = 0;
}

function findLabel(px, py) {
  var x = Math.max(0, Math.min(S - 1, Math.round(px)));
  var y = Math.max(0, Math.min(S - 1, Math.round(py)));
  var L = labels[y * S + x];
  if (L) return L;
  for (var r = 1; r <= 8; r++) {
    for (var dy = -r; dy <= r; dy++) {
      for (var dx = -r; dx <= r; dx++) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
        var xx = x + dx, yy = y + dy;
        if (xx < 0 || yy < 0 || xx >= S || yy >= S) continue;
        L = labels[yy * S + xx];
        if (L) return L;
      }
    }
  }
  return 0;
}

// 領域 L を(線の下まで少し広げて)指定色で ctx に描く
function paintRegion(ctx, L, r, g, b) {
  var m = regionBuf, i, x, pass;
  for (i = 0; i < N; i++) m[i] = labels[i] === L ? 1 : 0;
  for (pass = 1; pass <= 3; pass++) {
    for (i = 0; i < N; i++) {
      if (m[i] !== pass) continue;
      x = i % S;
      if (x > 0 && m[i - 1] === 0 && labels[i - 1] === 0) m[i - 1] = pass + 1;
      if (x < S - 1 && m[i + 1] === 0 && labels[i + 1] === 0) m[i + 1] = pass + 1;
      if (i >= S && m[i - S] === 0 && labels[i - S] === 0) m[i - S] = pass + 1;
      if (i < N - S && m[i + S] === 0 && labels[i + S] === 0) m[i + S] = pass + 1;
    }
  }
  var img = ctx.createImageData(S, S), d = img.data, o;
  for (i = 0; i < N; i++) {
    if (!m[i]) continue;
    o = i * 4; d[o] = r; d[o + 1] = g; d[o + 2] = b; d[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

function hexToRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map(function (v) { return ('0' + v.toString(16)).slice(-2); }).join('');
}

/* ---------- 履歴 ---------- */
function pushHistory() {
  hist.length = hi + 1;
  hist.push(cctx.getImageData(0, 0, S, S));
  if (hist.length > MAX_HISTORY) hist.shift();
  hi = hist.length - 1;
  updateButtons();
}
function undo() { if (hi > 0) { hi--; cctx.putImageData(hist[hi], 0, 0); updateButtons(); } }
function redo() { if (hi < hist.length - 1) { hi++; cctx.putImageData(hist[hi], 0, 0); updateButtons(); } }
function updateButtons() {
  $('undo').disabled = hi <= 0;
  $('redo').disabled = hi >= hist.length - 1;
}

/* ---------- 操作 ---------- */
function fillAt(p) {
  var L = findLabel(p.x, p.y);
  if (!L) return;
  var c = hexToRgb(color);
  paintRegion(tmpx, L, c[0], c[1], c[2]);
  cctx.globalCompositeOperation = 'source-over';
  cctx.drawImage(tmpC, 0, 0);
  pushHistory();
}

function pickAt(p) {
  var x = Math.max(0, Math.min(S - 1, Math.round(p.x))), y = Math.max(0, Math.min(S - 1, Math.round(p.y)));
  var d = cctx.getImageData(x, y, 1, 1).data;
  setColor(d[3] < 128 ? '#ffffff' : rgbToHex(d[0], d[1], d[2]));
  setTool(prevTool === 'pick' || prevTool === 'erase' ? 'fill' : prevTool);
}

var drawing = false, activeId = null, last = null, useMask = false;

function startStroke(p) {
  drawing = true;
  snapx.globalCompositeOperation = 'copy'; snapx.drawImage(colorC, 0, 0);
  sx.globalCompositeOperation = 'source-over'; sx.clearRect(0, 0, S, S);
  useMask = false;
  if (stayInside) {
    var L = findLabel(p.x, p.y);
    if (L) {
      if (maskLabel !== L) { paintRegion(maskx, L, 0, 0, 0); maskLabel = L; }
      useMask = true;
    }
  }
  sx.strokeStyle = sx.fillStyle = tool === 'erase' ? '#000000' : color;
  sx.lineWidth = size; sx.lineCap = 'round'; sx.lineJoin = 'round';
  sx.beginPath(); sx.arc(p.x, p.y, size / 2, 0, TAU); sx.fill();
  last = p;
  compose();
}
function extendStroke(p) {
  sx.globalCompositeOperation = 'source-over';
  sx.beginPath(); sx.moveTo(last.x, last.y); sx.lineTo(p.x, p.y); sx.stroke();
  last = p;
}
function compose() {
  if (useMask) {
    sx.globalCompositeOperation = 'destination-in';
    sx.drawImage(maskC, 0, 0);
    sx.globalCompositeOperation = 'source-over';
  }
  cctx.globalCompositeOperation = 'copy';
  cctx.drawImage(snapC, 0, 0);
  cctx.globalCompositeOperation = tool === 'erase' ? 'destination-out' : 'source-over';
  cctx.drawImage(scratchC, 0, 0);
  cctx.globalCompositeOperation = 'source-over';
}
function endStroke() {
  if (!drawing) return;
  drawing = false; activeId = null;
  pushHistory();
}

function pos(e) {
  var r = lineC.getBoundingClientRect();
  return { x: (e.clientX - r.left) * S / r.width, y: (e.clientY - r.top) * S / r.height };
}

lineC.addEventListener('pointerdown', function (e) {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (drawing) return;
  e.preventDefault();
  var p = pos(e);
  if (tool === 'fill') { fillAt(p); return; }
  if (tool === 'pick') { pickAt(p); return; }
  activeId = e.pointerId;
  try { lineC.setPointerCapture(e.pointerId); } catch (err) {}
  startStroke(p);
});
lineC.addEventListener('pointermove', function (e) {
  moveRing(e);
  if (!drawing || e.pointerId !== activeId) return;
  e.preventDefault();
  var list = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
  if (list && list.length) { for (var i = 0; i < list.length; i++) extendStroke(pos(list[i])); }
  else extendStroke(pos(e));
  compose();
});
function finish(e) { if (e.pointerId === activeId) endStroke(); }
lineC.addEventListener('pointerup', finish);
lineC.addEventListener('pointercancel', finish);
lineC.addEventListener('lostpointercapture', finish);
lineC.addEventListener('pointerleave', function () { ring.style.display = 'none'; });
lineC.addEventListener('contextmenu', function (e) { e.preventDefault(); });

function moveRing(e) {
  if (e.pointerType === 'touch' || (tool !== 'brush' && tool !== 'erase')) { ring.style.display = 'none'; return; }
  var r = lineC.getBoundingClientRect(), d = Math.max(4, size * r.width / S);
  ring.style.display = 'block';
  ring.style.width = ring.style.height = d + 'px';
  ring.style.left = (e.clientX - r.left) + 'px';
  ring.style.top = (e.clientY - r.top) + 'px';
}

/* ---------- 絵の切り替え・全消し・保存 ---------- */
function selectPic(i) {
  if (drawing) return;
  if (hi >= 0) saved[PICS[cur].id] = hist[hi];
  cur = i;
  renderLine();
  cctx.globalCompositeOperation = 'source-over';
  cctx.clearRect(0, 0, S, S);
  var s = saved[PICS[cur].id];
  if (s) cctx.putImageData(s, 0, 0);
  hist = []; hi = -1; pushHistory();
  Array.prototype.forEach.call($('pics').children, function (b, n) { b.setAttribute('aria-pressed', n === cur ? 'true' : 'false'); });
}

function clearAll() {
  if (drawing) return;
  cctx.clearRect(0, 0, S, S);
  pushHistory();
}

function savePng() {
  var o = offscreen(), x = o.getContext('2d');
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, S, S);
  x.drawImage(colorC, 0, 0); x.drawImage(lineC, 0, 0);
  o.toBlob(function (blob) {
    if (!blob) return;
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = 'nurie-' + PICS[cur].id + '.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }, 'image/png');
}

/* ---------- UI ---------- */
var HINTS = {
  fill: '色をえらんで、塗りたいところをクリック(タップ)してください。',
  brush: 'なぞって自由に塗れます。',
  erase: 'なぞったところの色を消します。',
  pick: '絵の中の色をクリック(タップ)すると、その色が使えます。'
};

function setTool(t) {
  if (t !== tool) prevTool = tool;
  tool = t;
  Array.prototype.forEach.call($('tools').children, function (b) {
    b.setAttribute('aria-pressed', b.dataset.tool === t ? 'true' : 'false');
  });
  hint.textContent = HINTS[t];
  if (t !== 'brush' && t !== 'erase') ring.style.display = 'none';
}

function setColor(c) {
  color = c.toLowerCase();
  $('curSwatch').style.background = color;
  $('custom').value = color;
  Array.prototype.forEach.call($('palette').children, function (b) {
    b.setAttribute('aria-pressed', b.dataset.color === color ? 'true' : 'false');
  });
}

function setSize(v) {
  size = v;
  var d = Math.max(3, Math.min(40, v * 0.36));
  $('sizeDot').style.width = $('sizeDot').style.height = d + 'px';
}

function buildUi() {
  var pics = $('pics');
  PICS.forEach(function (p, i) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'pic'; b.setAttribute('aria-pressed', 'false');
    var c = document.createElement('canvas'); c.width = c.height = 160;
    var g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, 160, 160);
    // サムネイルは透明キャンバスに描いてから白地に重ねる
    var t = document.createElement('canvas'); t.width = t.height = 160;
    var tg = t.getContext('2d');
    tg.setTransform(160 / D, 0, 0, 160 / D, 0, 0);
    p.draw(makeKit(tg, 8));
    g.drawImage(t, 0, 0);
    var s = document.createElement('span'); s.textContent = p.name;
    b.appendChild(c); b.appendChild(s);
    b.addEventListener('click', function () { selectPic(i); });
    pics.appendChild(b);
  });

  var pal = $('palette');
  COLORS.forEach(function (c) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'sw'; b.dataset.color = c;
    b.style.background = c; b.title = c; b.setAttribute('aria-label', '色 ' + c);
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', function () {
      setColor(c);
      if (tool === 'erase' || tool === 'pick') setTool(prevTool === 'brush' ? 'brush' : 'fill');
    });
    pal.appendChild(b);
  });

  Array.prototype.forEach.call($('tools').children, function (b) {
    b.addEventListener('click', function () { setTool(b.dataset.tool); });
  });
  $('size').addEventListener('input', function () { setSize(+this.value); });
  $('inside').addEventListener('change', function () { stayInside = this.checked; });
  $('custom').addEventListener('input', function () { setColor(this.value); });
  $('undo').addEventListener('click', undo);
  $('redo').addEventListener('click', redo);
  $('clear').addEventListener('click', clearAll);
  $('save').addEventListener('click', savePng);

  document.addEventListener('keydown', function (e) {
    if (!(e.ctrlKey || e.metaKey) || drawing) return;
    var key = e.key.toLowerCase();
    if (key === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
    else if (key === 'y') { e.preventDefault(); redo(); }
  });
}

buildUi();
setColor(color);
setSize(size);
setTool('fill');
selectPic(0);

})();
