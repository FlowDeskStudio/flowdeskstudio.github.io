<!DOCTYPE html>
<html lang="ja">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-Tp8zIXdbNLovml1fIje/Vua2bmzWgHKC4kPOilosse0='; script-src-attr 'none'; style-src 'sha256-GVJGOAAjIO8DoboX//Qt5jt5TqiJcZccr0x5L58USPs='; style-src-attr 'unsafe-inline'; img-src 'none'; media-src 'none'; connect-src 'none'; font-src 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'; manifest-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>神経衰弱</title>
<style>
  :root {
    --bg: #f3f0e8;
    --panel: #ffffff;
    --ink: #24303a;
    --sub: #63717d;
    --line: #d9d3c5;
    --accent: #1f7a6c;
    --accent-ink: #ffffff;
    --card-back: #1f5f7a;
    --card-back2: #2b7c9c;
    --card-face: #fffdf7;
    --matched: #e2f3e6;
    --matched-line: #58a86b;
    --p2: #b4532a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161b20;
      --panel: #212930;
      --ink: #eef1f3;
      --sub: #a3afb9;
      --line: #37424c;
      --accent: #3fb8a4;
      --accent-ink: #0c1f1c;
      --card-back: #2a6f8e;
      --card-back2: #3a8fb3;
      --card-face: #f6f3ea;
      --matched: #cfe9d5;
      --matched-line: #58a86b;
      --p2: #f0946a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 12px 24px;
  }
  h1 { font-size: 1.5rem; margin: 0 0 10px; letter-spacing: 0.1em; }

  .controls {
    display: flex; flex-wrap: wrap; gap: 8px 14px;
    justify-content: center; align-items: center;
    margin-bottom: 10px;
  }
  .group { display: flex; align-items: center; gap: 4px; }
  .group-label { font-size: 0.8rem; color: var(--sub); margin-right: 2px; }
  button {
    font: inherit; color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button[aria-pressed="true"] {
    background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700;
  }
  .primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }

  .status {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    margin-bottom: 6px;
  }
  .stat {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 4px 12px; min-width: 84px; text-align: center;
  }
  .stat small { display: block; font-size: 0.7rem; color: var(--sub); }
  .stat b { font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  .stat.turn { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  .stat.p2.turn { border-color: var(--p2); box-shadow: 0 0 0 2px var(--p2) inset; }

  .message { min-height: 1.5em; margin: 2px 0 10px; font-size: 0.95rem; color: var(--sub); text-align: center; }

  .board {
    --cols: 4; --rows: 4;
    display: grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    gap: clamp(5px, 1.4vw, 10px);
    width: max(230px, min(96vw, calc(var(--cols) * 130px), calc((100vh - 250px) * var(--cols) / var(--rows) * 0.75)));
    font-size: calc(max(230px, min(96vw, calc(var(--cols) * 130px), calc((100vh - 250px) * var(--cols) / var(--rows) * 0.75))) / var(--cols) * 0.46);
  }
  .card {
    aspect-ratio: 3 / 4;
    padding: 0; border: none; background: transparent;
    perspective: 600px;
    font-size: inherit;
    border-radius: 10px;
  }
  .card:hover { border: none; }
  .card-inner {
    position: relative; width: 100%; height: 100%; display: block;
    transform-style: preserve-3d;
    transition: transform 0.35s ease;
  }
  .card.open .card-inner { transform: rotateY(180deg); }
  .side {
    position: absolute; inset: 0;
    border-radius: 10px;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.22);
  }
  .back {
    background:
      repeating-linear-gradient(45deg, transparent 0 8px, rgba(255,255,255,0.13) 8px 16px),
      linear-gradient(135deg, var(--card-back), var(--card-back2));
    border: 3px solid rgba(255,255,255,0.75);
  }
  .face {
    background: var(--card-face);
    border: 2px solid var(--line);
    transform: rotateY(180deg);
    line-height: 1;
    color: #222;
  }
  .card.matched .face { background: var(--matched); border-color: var(--matched-line); }
  .card.matched { cursor: default; }
  .card.matched .card-inner { animation: pop 0.4s ease; }
  .card.miss .card-inner { animation: shake 0.35s ease 0.35s; }
  @keyframes pop {
    0% { transform: rotateY(180deg) scale(1); }
    50% { transform: rotateY(180deg) scale(1.1); }
    100% { transform: rotateY(180deg) scale(1); }
  }
  @keyframes shake {
    0%, 100% { transform: rotateY(180deg) translateX(0); }
    25% { transform: rotateY(180deg) translateX(-5px); }
    75% { transform: rotateY(180deg) translateX(5px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .card-inner { transition: none; }
    .card.matched .card-inner, .card.miss .card-inner { animation: none; }
  }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center; padding: 16px;
    z-index: 10;
  }
  .overlay[hidden] { display: none; }
  .dialog {
    background: var(--panel); color: var(--ink);
    border-radius: 14px; padding: 24px 26px; max-width: 360px; width: 100%;
    text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .dialog h2 { margin: 0 0 8px; font-size: 1.4rem; }
  .dialog p { margin: 6px 0; }
  .dialog .buttons { margin-top: 16px; display: flex; gap: 10px; justify-content: center; }
  .note { font-size: 0.75rem; color: var(--sub); margin-top: 14px; text-align: center; max-width: 520px; }
</style>
</head>
<body>
  <h1>神経衰弱</h1>

  <div class="controls">
    <div class="group" role="group" aria-label="難易度">
      <span class="group-label">難易度</span>
      <button type="button" data-level="easy">やさしい</button>
      <button type="button" data-level="normal">ふつう</button>
      <button type="button" data-level="hard">むずかしい</button>
    </div>
    <div class="group" role="group" aria-label="人数">
      <span class="group-label">人数</span>
      <button type="button" data-players="1">1人</button>
      <button type="button" data-players="2">2人対戦</button>
    </div>
    <button type="button" id="restart" class="primary">最初から</button>
  </div>

  <div class="status" id="status"></div>
  <div class="message" id="message" aria-live="polite"></div>

  <div class="board" id="board"></div>

  <p class="note">同じ絵柄のカードを2枚そろえましょう。記録はこのページを開いている間だけ保持されます。</p>

  <div class="overlay" id="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
      <h2 id="resultTitle"></h2>
      <div id="resultBody"></div>
      <div class="buttons">
        <button type="button" id="again" class="primary">もう一度遊ぶ</button>
        <button type="button" id="closeDialog">閉じる</button>
      </div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  var SYMBOLS = [
    ['🍎', 'りんご'], ['🍌', 'バナナ'], ['🍇', 'ぶどう'], ['🍓', 'いちご'],
    ['🍉', 'すいか'], ['🍑', 'もも'], ['🍒', 'さくらんぼ'], ['🥝', 'キウイ'],
    ['🐶', 'いぬ'], ['🐱', 'ねこ'], ['🐼', 'パンダ'], ['🐸', 'かえる'],
    ['🐧', 'ペンギン'], ['🦊', 'きつね'], ['🐙', 'たこ'], ['🦋', 'ちょう'],
    ['⭐', 'ほし'], ['🌙', 'つき']
  ];
  var LEVELS = {
    easy:   { cols: 4, rows: 3, label: 'やさしい' },
    normal: { cols: 4, rows: 4, label: 'ふつう' },
    hard:   { cols: 6, rows: 4, label: 'むずかしい' }
  };

  var boardEl = document.getElementById('board');
  var statusEl = document.getElementById('status');
  var messageEl = document.getElementById('message');
  var overlayEl = document.getElementById('overlay');
  var resultTitle = document.getElementById('resultTitle');
  var resultBody = document.getElementById('resultBody');

  var level = 'normal';
  var players = 1;
  var best = {};            // メモリ上のみ（保存しない）
  var cards = [];           // {symbol, name, el, open, matched}
  var first = null;
  var locked = false;
  var moves = 0;
  var pairsFound = 0;
  var totalPairs = 0;
  var scores = [0, 0];
  var turn = 0;
  var seconds = 0;
  var timerId = null;
  var flipBackId = null;
  var finished = false;

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function formatTime(s) {
    var m = Math.floor(s / 60), r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }

  function stopTimer() {
    if (timerId !== null) { clearInterval(timerId); timerId = null; }
  }
  function startTimer() {
    if (timerId !== null) return;
    timerId = setInterval(function () { seconds++; renderStatus(); }, 1000);
  }

  function stat(label, value, cls) {
    return '<div class="stat ' + (cls || '') + '"><small>' + label + '</small><b>' + value + '</b></div>';
  }

  function renderStatus() {
    var html = '';
    if (players === 1) {
      html += stat('手数', moves);
      html += stat('時間', formatTime(seconds));
      html += stat('そろった組', pairsFound + ' / ' + totalPairs);
      var b = best[level];
      html += stat('最少手数', b ? b : '-');
    } else {
      html += stat('プレイヤー1', scores[0] + ' 組', 'p1' + (turn === 0 && !finished ? ' turn' : ''));
      html += stat('プレイヤー2', scores[1] + ' 組', 'p2' + (turn === 1 && !finished ? ' turn' : ''));
      html += stat('残り', (totalPairs - pairsFound) + ' 組');
    }
    statusEl.innerHTML = html;
  }

  function setMessage(text) { messageEl.textContent = text; }

  function turnMessage() {
    if (players === 2) return 'プレイヤー' + (turn + 1) + 'の番です';
    return 'カードを2枚めくってください';
  }

  function updateLabel(card, index) {
    var label = 'カード' + (index + 1) + '：';
    if (card.matched) label += card.name + '（そろいました）';
    else if (card.open) label += card.name;
    else label += '裏向き';
    card.el.setAttribute('aria-label', label);
  }

  function setOpen(card, open) {
    card.open = open;
    card.el.classList.toggle('open', open);
    updateLabel(card, cards.indexOf(card));
  }

  function newGame() {
    stopTimer();
    if (flipBackId !== null) { clearTimeout(flipBackId); flipBackId = null; }
    overlayEl.hidden = true;

    var cfg = LEVELS[level];
    totalPairs = cfg.cols * cfg.rows / 2;
    var picked = shuffle(SYMBOLS.slice()).slice(0, totalPairs);
    var deck = shuffle(picked.concat(picked));

    first = null; locked = false; finished = false;
    moves = 0; pairsFound = 0; seconds = 0;
    scores = [0, 0]; turn = 0;

    boardEl.style.setProperty('--cols', cfg.cols);
    boardEl.style.setProperty('--rows', cfg.rows);
    boardEl.innerHTML = '';
    cards = deck.map(function (s, i) {
      var el = document.createElement('button');
      el.type = 'button';
      el.className = 'card';
      el.innerHTML =
        '<span class="card-inner">' +
          '<span class="side back" aria-hidden="true"></span>' +
          '<span class="side face" aria-hidden="true"></span>' +
        '</span>';
      var card = { symbol: s[0], name: s[1], el: el, open: false, matched: false };
      el.addEventListener('click', function () { onCardClick(card); });
      boardEl.appendChild(el);
      return card;
    });
    cards.forEach(updateLabel);

    document.querySelectorAll('[data-level]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.level === level));
    });
    document.querySelectorAll('[data-players]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(Number(b.dataset.players) === players));
    });

    renderStatus();
    setMessage(turnMessage());
  }

  function onCardClick(card) {
    if (locked || finished || card.open || card.matched) return;
    startTimer();

    // 絵柄はめくった時だけDOMに入れる（裏向きのまま覗けないように）
    card.el.querySelector('.face').textContent = card.symbol;
    setOpen(card, true);

    if (!first) { first = card; return; }

    var a = first, b = card;
    first = null;
    moves++;

    if (a.symbol === b.symbol) {
      a.matched = b.matched = true;
      a.el.classList.add('matched');
      b.el.classList.add('matched');
      updateLabel(a, cards.indexOf(a));
      updateLabel(b, cards.indexOf(b));
      pairsFound++;
      scores[turn]++;
      if (pairsFound === totalPairs) {
        finish();
      } else {
        setMessage(players === 2
          ? 'そろいました！ プレイヤー' + (turn + 1) + 'がもう一度めくれます'
          : 'そろいました！（' + a.name + '）');
      }
      renderStatus();
    } else {
      locked = true;
      a.el.classList.add('miss');
      b.el.classList.add('miss');
      setMessage('ちがいます（' + a.name + ' と ' + b.name + '）');
      renderStatus();
      flipBackId = setTimeout(function () {
        flipBackId = null;
        [a, b].forEach(function (c) {
          c.el.classList.remove('miss');
          setOpen(c, false);
          var face = c.el.querySelector('.face');
          setTimeout(function () { if (!c.open) face.textContent = ''; }, 350);
        });
        if (players === 2) turn = 1 - turn;
        locked = false;
        renderStatus();
        setMessage(turnMessage());
      }, 1000);
    }
  }

  function finish() {
    finished = true;
    stopTimer();
    var body = '';
    if (players === 1) {
      var prev = best[level];
      var isBest = !prev || moves < prev;
      if (isBest) best[level] = moves;
      resultTitle.textContent = 'クリア！';
      body += '<p>難易度：' + LEVELS[level].label + '</p>';
      body += '<p>手数：<b>' + moves + '</b>　時間：<b>' + formatTime(seconds) + '</b></p>';
      if (isBest && prev) body += '<p>最少手数を更新しました！</p>';
      setMessage('すべてそろいました！');
    } else {
      if (scores[0] === scores[1]) resultTitle.textContent = '引き分け！';
      else resultTitle.textContent = 'プレイヤー' + (scores[0] > scores[1] ? 1 : 2) + 'の勝ち！';
      body += '<p>プレイヤー1：<b>' + scores[0] + '</b> 組</p>';
      body += '<p>プレイヤー2：<b>' + scores[1] + '</b> 組</p>';
      setMessage(resultTitle.textContent);
    }
    resultBody.innerHTML = body;
    setTimeout(function () {
      if (!finished) return;
      overlayEl.hidden = false;
      document.getElementById('again').focus();
    }, 600);
  }

  document.querySelectorAll('[data-level]').forEach(function (b) {
    b.addEventListener('click', function () { level = b.dataset.level; newGame(); });
  });
  document.querySelectorAll('[data-players]').forEach(function (b) {
    b.addEventListener('click', function () { players = Number(b.dataset.players); newGame(); });
  });
  document.getElementById('restart').addEventListener('click', newGame);
  document.getElementById('again').addEventListener('click', newGame);
  document.getElementById('closeDialog').addEventListener('click', function () {
    overlayEl.hidden = true;
    document.getElementById('restart').focus();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !overlayEl.hidden) {
      overlayEl.hidden = true;
      document.getElementById('restart').focus();
    }
  });

  newGame();
})();
</script>
</body>
</html>
