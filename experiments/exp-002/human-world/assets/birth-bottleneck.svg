<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">出生停止のボトルネック</title>
  <desc id="desc">出生累計3076で停止。Step7923には生殖可能年齢の男女が残るが出生条件を満たす夫婦は0、Step8219以降は該当年齢女性0。</desc>
