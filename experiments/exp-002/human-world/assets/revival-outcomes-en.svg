<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Two revivals and the deaths that followed</title>
  <desc id="desc">The God revived 36 people at Step 7542 and 30 at Step 7563. Every revived person died of starvation again within 1–8 steps.</desc>
  <rect width="1400" height="560" fill="#fffef9"/>
  <rect width="1400" height="108" fill="#12130f"/><text x="46" y="45" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#c9ff4a">REVIVAL DID NOT BECOME RECOVERY</text><text x="46" y="81" font-family="Arial, 'Yu Gothic', sans-serif" font-size="30" font-weight="800" fill="#f4f1e8">Revival worked. Survival did not last.</text>
  <g transform="translate(50 158)"><rect width="610" height="320" fill="#f4f1e8" stroke="#12130f"/><text x="32" y="44" font-family="Consolas, monospace" font-size="16" font-weight="700">STEP 7542</text><text x="32" y="126" font-family="Arial, sans-serif" font-size="78" font-weight="900" fill="#7180ff">36</text><text x="174" y="112" font-family="Arial, 'Yu Gothic', sans-serif" font-size="24" font-weight="700">people revived</text><line x1="32" y1="168" x2="566" y2="168" stroke="#12130f"/><text x="32" y="216" font-family="Arial, 'Yu Gothic', sans-serif" font-size="22">1–8 steps later</text><text x="32" y="278" font-family="Arial, sans-serif" font-size="64" font-weight="900" fill="#ff765f">36</text><text x="174" y="266" font-family="Arial, 'Yu Gothic', sans-serif" font-size="22" font-weight="700">died of starvation again</text></g>
  <g transform="translate(740 158)"><rect width="610" height="320" fill="#f4f1e8" stroke="#12130f"/><text x="32" y="44" font-family="Consolas, monospace" font-size="16" font-weight="700">STEP 7563</text><text x="32" y="126" font-family="Arial, sans-serif" font-size="78" font-weight="900" fill="#7180ff">30</text><text x="174" y="112" font-family="Arial, 'Yu Gothic', sans-serif" font-size="24" font-weight="700">people revived again</text><line x1="32" y1="168" x2="566" y2="168" stroke="#12130f"/><text x="32" y="216" font-family="Arial, 'Yu Gothic', sans-serif" font-size="22">1–8 steps later</text><text x="32" y="278" font-family="Arial, sans-serif" font-size="64" font-weight="900" fill="#ff765f">30</text><text x="174" y="266" font-family="Arial, 'Yu Gothic', sans-serif" font-size="22" font-weight="700">died of starvation again</text></g>
</svg>
