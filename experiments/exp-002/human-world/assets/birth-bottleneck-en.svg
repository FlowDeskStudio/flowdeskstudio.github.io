<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">The birth bottleneck</title>
  <desc id="desc">Births stopped at 3,076. At Step 7923 adults of reproductive age remained, but no couple met the birth conditions. From Step 8219 onward, no women of reproductive age remained.</desc>
  <rect width="1200" height="620" fill="#fffef9"/>
  <rect width="1200" height="112" fill="#12130f"/><text x="42" y="46" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#c9ff4a">POSTMORTEM ANALYSIS</text><text x="42" y="82" font-family="Arial, 'Yu Gothic', sans-serif" font-size="30" font-weight="800" fill="#f4f1e8">People remained. A next generation did not.</text><g transform="translate(42 166)"><rect width="338" height="344" fill="#fffef9" stroke="#12130f"/><rect width="338" height="10" fill="#7180ff"/><text x="24" y="54" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#67685f">LAST BIRTH</text><text x="24" y="154" font-family="Arial, sans-serif" font-size="68" font-weight="900" fill="#7180ff">Birth 3076</text><text x="24" y="226" font-family="Arial, 'Yu Gothic', sans-serif" font-size="19" fill="#12130f">After Step 7716</text><text x="24" y="264" font-family="Arial, 'Yu Gothic', sans-serif" font-size="19" font-weight="700" fill="#12130f">By Step 7720</text></g><g transform="translate(431 166)"><rect width="338" height="344" fill="#fffef9" stroke="#12130f"/><rect width="338" height="10" fill="#ff765f"/><text x="24" y="54" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#67685f">STEP 7923</text><text x="24" y="154" font-family="Arial, sans-serif" font-size="68" font-weight="900" fill="#ff765f">54 / 81</text><text x="24" y="226" font-family="Arial, 'Yu Gothic', sans-serif" font-size="19" fill="#12130f">Women 18–42 / men 18–55</text><text x="24" y="264" font-family="Arial, 'Yu Gothic', sans-serif" font-size="19" font-weight="700" fill="#12130f">Eligible couples 0</text></g><g transform="translate(820 166)"><rect width="338" height="344" fill="#fffef9" stroke="#12130f"/><rect width="338" height="10" fill="#12130f"/><text x="24" y="54" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#67685f">STEP 8219+</text><text x="24" y="154" font-family="Arial, sans-serif" font-size="68" font-weight="900" fill="#12130f">0</text><text x="24" y="226" font-family="Arial, 'Yu Gothic', sans-serif" font-size="19" fill="#12130f">Women aged 18–42</text><text x="24" y="264" font-family="Arial, 'Yu Gothic', sans-serif" font-size="19" font-weight="700" fill="#12130f">No ordinary birth path</text></g><path d="M380 338 H421 M769 338 H810" stroke="#12130f" stroke-width="4" marker-end="url(#arrow)"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#12130f"/></marker></defs><text x="42" y="576" font-family="Arial, 'Yu Gothic', sans-serif" font-size="17" fill="#67685f">Analysis based on saved checkpoints. The exact last-birth step and individual reasons for failed family formation are unknown.</text>
</svg>
