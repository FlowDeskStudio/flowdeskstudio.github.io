<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">46 Divine Actionsの内訳</title>
  <desc id="desc">資源調整20、蘇生7、啓示5、地域変更4、法則変更4、治療3、災害抑制3。</desc>
  <rect width="900" height="600" fill="#fffef9"/>
  <rect width="900" height="94" fill="#12130f"/><text x="36" y="40" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#c9ff4a">46 DIVINE ACTIONS（神の操作）</text><text x="36" y="72" font-family="Arial, 'Yu Gothic', sans-serif" font-size="27" font-weight="800" fill="#f4f1e8">Godが使ったAction（操作）の内訳</text><text x="36" y="160" font-family="Arial, 'Yu Gothic', sans-serif" font-size="14" font-weight="700" fill="#12130f">adjust_resource（資源調整）</text><rect x="270" y="138" width="470" height="30" fill="#f4f1e8"/><rect x="270" y="138" width="470" height="30" fill="#c9ff4a" stroke="#12130f"/><text x="758" y="161" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#12130f">20</text><text x="36" y="218" font-family="Arial, 'Yu Gothic', sans-serif" font-size="14" font-weight="700" fill="#12130f">revive_people（蘇生）</text><rect x="270" y="196" width="470" height="30" fill="#f4f1e8"/><rect x="270" y="196" width="164.5" height="30" fill="#7b35d1" stroke="#12130f"/><text x="758" y="219" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#12130f">7</text><text x="36" y="276" font-family="Arial, 'Yu Gothic', sans-serif" font-size="14" font-weight="700" fill="#12130f">send_revelation（啓示）</text><rect x="270" y="254" width="470" height="30" fill="#f4f1e8"/><rect x="270" y="254" width="117.5" height="30" fill="#ff765f" stroke="#12130f"/><text x="758" y="277" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#12130f">5</text><text x="36" y="334" font-family="Arial, 'Yu Gothic', sans-serif" font-size="14" font-weight="700" fill="#12130f">alter_region（地域変更）</text><rect x="270" y="312" width="470" height="30" fill="#f4f1e8"/><rect x="270" y="312" width="94" height="30" fill="#a6b1ff" stroke="#12130f"/><text x="758" y="335" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#12130f">4</text><text x="36" y="392" font-family="Arial, 'Yu Gothic', sans-serif" font-size="14" font-weight="700" fill="#12130f">modify_law（法則変更）</text><rect x="270" y="370" width="470" height="30" fill="#f4f1e8"/><rect x="270" y="370" width="94" height="30" fill="#12130f" stroke="#12130f"/><text x="758" y="393" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#12130f">4</text><text x="36" y="450" font-family="Arial, 'Yu Gothic', sans-serif" font-size="14" font-weight="700" fill="#12130f">heal_people（治療）</text><rect x="270" y="428" width="470" height="30" fill="#f4f1e8"/><rect x="270" y="428" width="70.5" height="30" fill="#7180ff" stroke="#12130f"/><text x="758" y="451" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#12130f">3</text><text x="36" y="508" font-family="Arial, 'Yu Gothic', sans-serif" font-size="14" font-weight="700" fill="#12130f">suppress_disaster（災害抑制）</text><rect x="270" y="486" width="470" height="30" fill="#f4f1e8"/><rect x="270" y="486" width="70.5" height="30" fill="#ffb09f" stroke="#12130f"/><text x="758" y="509" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#12130f">3</text>
</svg>
