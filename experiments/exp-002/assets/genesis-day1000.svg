<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">EXP-002 Genesis and Day 1000 comparison</title>
  <desc id="desc">A reconstructed comparison showing the same six registers and relations at Genesis and Day 1000 with changed values.</desc>
  <defs><style>.sans{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:"Cascadia Mono",Consolas,monospace}.node{fill:#181c17;stroke:#c9ff4a;stroke-width:2}.title{fill:#f4f1e8;font-size:38px;font-weight:850}.label{fill:#c9ff4a;font-size:15px;font-weight:900}.value{fill:#f4f1e8;font-size:18px}.small{fill:#bfc5c0;font-size:16px}</style></defs>
  <rect width="1400" height="900" fill="#11130f"/>
  <rect x="40" y="30" width="1320" height="52" rx="26" fill="#c9ff4a"/><text x="700" y="64" text-anchor="middle" class="sans" fill="#11130f" font-size="15" font-weight="900">RECONSTRUCTED COMPARISON · NOT A CANONICAL SCREENSHOT</text>
  <text x="80" y="150" class="sans title">The shape stayed. The values changed.</text>
  <text x="80" y="187" class="sans small">No register, relation, or rule was added or removed during the 1000-day run.</text>
  <rect x="70" y="230" width="600" height="565" rx="24" fill="#181c17" stroke="#343a34"/><rect x="730" y="230" width="600" height="565" rx="24" fill="#181c17" stroke="#343a34"/>
  <text x="110" y="285" class="sans label">GENESIS · DAY 0</text><text x="770" y="285" class="sans label">END OF GOD PERIOD · DAY 1000</text>
  <text x="110" y="330" class="mono value">coherence 17 · divergence 43</text><text x="770" y="330" class="mono value">coherence 1574 · divergence 7003</text>
  <g class="sans">
    <g transform="translate(215 420)"><circle r="62" class="node"/><text y="-8" text-anchor="middle" class="label">R1</text><text y="23" text-anchor="middle" class="mono value">2 / 11</text></g>
    <g transform="translate(370 370)"><circle r="62" class="node"/><text y="-8" text-anchor="middle" class="label">R2</text><text y="23" text-anchor="middle" class="mono value">3 / 17</text></g>
    <g transform="translate(525 420)"><circle r="62" class="node"/><text y="-8" text-anchor="middle" class="label">R3</text><text y="23" text-anchor="middle" class="mono value">5 / 23</text></g>
    <g transform="translate(525 610)"><circle r="62" class="node"/><text y="-8" text-anchor="middle" class="label">R4</text><text y="23" text-anchor="middle" class="mono value">7 / 31</text></g>
    <g transform="translate(370 660)"><circle r="62" class="node"/><text y="-8" text-anchor="middle" class="label">R5</text><text y="23" text-anchor="middle" class="mono value">11 / 47</text></g>
    <g transform="translate(215 610)"><circle r="62" class="node"/><text y="-8" text-anchor="middle" class="label">R6</text><text y="23" text-anchor="middle" class="mono value">13 / 71</text></g>
    <g transform="translate(875 420)"><circle r="62" class="node"/><text y="-8" text-anchor="middle" class="label">R1</text><text y="23" text-anchor="middle" class="mono value">3876 / 83</text></g>
    <g transform="translate(1030 370)"><circle r="62" class="node"/><text y="-8" text-anchor="middle" class="label">R2</text><text y="23" text-anchor="middle" class="mono value">3680 / 91</text></g>
    <g transform="translate(1185 420)"><circle r="62" class="node"/><text y="-8" text-anchor="middle" class="label">R3</text><text y="23" text-anchor="middle" class="mono value">2028 / 70</text></g>
    <g transform="translate(1185 610)"><circle r="62" class="node"/><text y="-8" text-anchor="middle" class="label">R4</text><text y="23" text-anchor="middle" class="mono value">1721 / 86</text></g>
    <g transform="translate(1030 660)"><circle r="62" class="node"/><text y="-8" text-anchor="middle" class="label">R5</text><text y="23" text-anchor="middle" class="mono value">2454 / 34</text></g>
    <g transform="translate(875 610)"><circle r="62" class="node"/><text y="-8" text-anchor="middle" class="label">R6</text><text y="23" text-anchor="middle" class="mono value">2502 / 85</text></g>
  </g>
  <text x="110" y="755" class="sans small">Each pair is tone / openness.</text><text x="770" y="755" class="sans small">The numbers wrap around fixed ranges; they are states, not growth scores.</text>
  <text x="80" y="854" class="mono" fill="#aeb3ad" font-size="15">source: Canonical Genesis and verified Day 1000 state · ring layout is observer notation, not physical space</text>
</svg>
