    <rect x="90" y="520" width="280" height="150" rx="18" fill="#1d211c" stroke="#343a34"/><text x="118" y="558" fill="#7180ff" font-size="15" font-weight="900">DAY 384 → 448</text><text x="118" y="594" class="small">一つの値が上限へ到達</text><text x="118" y="621" class="small">世界は介入なしで</text><text x="118" y="648" class="small">その状態を抜けた</text>
